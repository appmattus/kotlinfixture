[versions]

kotlin = "2.4.21"

androidGradlePlugin = "9.5.1"
android-compileSdk = "37"
android-minSdk = "21"
dependencyCheckGradlePlugin = "13.0.0"
detektGradlePlugin = "1.23.8"
dokkaPlugin = "2.3.0"
gradleMavenPublishPlugin = "0.37.0"
gradleVersionsPlugin = "0.67.0"
jacoco = "0.8.16"
markdownlintGradlePlugin = "0.6.0"

classgraph = "4.8.200"
datafaker = "2.7.0"
generex = "1.0.2"
javafaker = "1.0.2"
jodaTime = "2.15.1"
kotest = "6.2.7"
kotlinFaker = "1.16.2"
kotlinX-coroutines = "1.11.0"
kotlinX-datetime = "0.8.0"
kotlinX-serialization = "1.13.0"
kTorm = "4.2.1"
# javafaker requires the older snakeyaml API
snakeyaml = { strictly = "1.27" }
threeTen = "1.7.5"

# Testing
androidX-testCore = "1.7.0"
androidX-testExtJunit = "1.3.0"
androidX-testRunner = "1.7.0"
junit4 = "4.13.2"
mockitoKotlin = "6.4.0"
robolectric = "4.18"

# Comparison tests
easyrandom = "5.0.0"
flextrade = "0.2.0"
# Only available at compile time in tests, to simulate a missing dependency
javaxInject = "1"
marcellogalhardo = "0.1.4"

[libraries]

classgraph = { module = "io.github.classgraph:classgraph", version.ref = "classgraph" }
datafaker = { module = "net.datafaker:datafaker", version.ref = "datafaker" }
generex = { module = "com.github.mifmif:generex", version.ref = "generex" }
javafaker = { module = "com.github.javafaker:javafaker", version.ref = "javafaker" }
jodaTime = { module = "joda-time:joda-time", version.ref = "jodaTime" }
kotest-propertyJvm = { module = "io.kotest:kotest-property-jvm", version.ref = "kotest" }
kotlinFaker = { module = "io.github.serpro69:kotlin-faker", version.ref = "kotlinFaker" }
kotlinX-coroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinX-coroutines" }
kotlinX-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinX-datetime" }
kotlinX-serializationJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinX-serialization" }
kTorm-core = { module = "org.ktorm:ktorm-core", version.ref = "kTorm" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
threeTen = { module = "org.threeten:threetenbp", version.ref = "threeTen" }

# Testing
androidX-testCore = { module = "androidx.test:core", version.ref = "androidX-testCore" }
androidX-testExtJunit = { module = "androidx.test.ext:junit", version.ref = "androidX-testExtJunit" }
androidX-testRunner = { module = "androidx.test:runner", version.ref = "androidX-testRunner" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
mockitoKotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockitoKotlin" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

# Comparison tests
easyrandom = { module = "org.jeasy:easy-random-core", version.ref = "easyrandom" }
flextrade = { module = "com.flextrade.jfixture:kfixture", version.ref = "flextrade" }
javaxInject = { module = "javax.inject:javax.inject", version.ref = "javaxInject" }
marcellogalhardo = { module = "com.github.marcellogalhardo:kotlin-fixture", version.ref = "marcellogalhardo" }

# Tools
detektFormatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detektGradlePlugin" }

# Plugins
buildscript_dependencyCheck = { module = "org.owasp:dependency-check-gradle", version.ref = "dependencyCheckGradlePlugin" }

[plugins]

detektPlugin = { id = "io.gitlab.arturbosch.detekt", version.ref = "detektGradlePlugin" }
dokkaPlugin = { id = "org.jetbrains.dokka", version.ref = "dokkaPlugin" }
gradleMavenPublishPlugin = { id = "com.vanniktech.maven.publish", version.ref = "gradleMavenPublishPlugin" }
gradleVersionsPlugin = { id = "com.github.ben-manes.versions", version.ref = "gradleVersionsPlugin" }
markdownlintGradlePlugin = { id = "com.appmattus.markdown", version.ref = "markdownlintGradlePlugin" }

android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
android-lint = { id = "com.android.lint", version.ref = "androidGradlePlugin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
