name: Build

on:
    push:
        branches:
            - main
        tags:
            - '**'
    pull_request:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
            -   uses: actions/setup-java@v6
                with:
                    distribution: 'zulu'
                    java-version: '21'
                    cache: 'gradle'

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v6

            -   name: Install Android SDK platform
                run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36"

            -   name: Build
                run: ./gradlew assemble check --stacktrace

            -   name: Upload coverage to Codecov
                uses: codecov/codecov-action@v7
                with:
                    token: ${{secrets.CODECOV_TOKEN}}

    # Releases publish only once every other job has passed
    publish:
        if: startsWith(github.ref, 'refs/tags/')
        needs: [ build ]
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
            -   uses: actions/setup-java@v6
                with:
                    distribution: 'zulu'
                    java-version: '21'
                    cache: 'gradle'

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v6

            -   name: Install Android SDK platform
                run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36"

            -   name: Prepare tag properties
                run: |
                    echo "${{secrets.GPG_SIGNING_SECRET_KEY_RING_FILE_BASE64}}" > $HOME/.gradle/sonatype-appmattus-keys.gpg.b64
                    base64 -d $HOME/.gradle/sonatype-appmattus-keys.gpg.b64 > $HOME/.gradle/sonatype-appmattus-keys.gpg
                    echo "${{secrets.GPG_GRADLE_PROPERTIES}}" > $HOME/.gradle/gradle.properties

            -   name: Upload tag
                run: ./gradlew publishAllPublicationsToMavenCentral -P"signing.secretKeyRingFile=$(echo $HOME/.gradle/sonatype-appmattus-keys.gpg)"
