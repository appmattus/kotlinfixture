name: CI

on:
  push:
    branches:
    - main
    tags:
    - '*'
  pull_request:
    branches:
    - main

jobs:
  validation:
    name: "Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6

  build:
    needs: [validation]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Build with Gradle
      run: ./gradlew assemble check --stacktrace

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{secrets.CODECOV_TOKEN}}

    - name: Prepare tag properties
      run: |
        echo "${{secrets.GPG_SIGNING_SECRET_KEY_RING_FILE_BASE64}}" > ~/.gradle/sonatype-appmattus-keys.gpg.b64
        base64 -d ~/.gradle/sonatype-appmattus-keys.gpg.b64 > ~/.gradle/sonatype-appmattus-keys.gpg
        echo "${{secrets.GPG_GRADLE_PROPERTIES}}" > ~/.gradle/gradle.properties
      if: startsWith(github.ref, 'refs/tags/')

    - name: Upload and release tag
      run: ./gradlew publishAndReleaseToMavenCentral --no-daemon --no-parallel --no-configuration-cache -Psigning.secretKeyRingFile=$(echo ~/.gradle/sonatype-appmattus-keys.gpg)
      if: startsWith(github.ref, 'refs/tags/')
